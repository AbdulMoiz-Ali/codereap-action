# Drop this file into .github/workflows/vibeaudit.yml in any repository
# and a VibeAudit security scan will run on every pull request.

name: VibeAudit Security Scan

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan changed files
    runs-on: ubuntu-latest
    steps:
      - uses: AbdulMoiz-Ali/vibeaudit-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: critical
